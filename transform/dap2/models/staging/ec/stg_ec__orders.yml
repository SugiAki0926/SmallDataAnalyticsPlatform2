version: 2
models:
  - name: stg_ec__orders
    description: lake.orders の1注文。order_date は ordered_at を Asia/Tokyo で切った日付。
    columns:
      - name: order_id
        data_type: bigint
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: bigint
        description: |
          顧客ID
          参照元のstg_ec__orders の customer_idが、
          参照先のstg_ec__customers の customer_id として存在するかを確認。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ec__customers')
                field: customer_id
      - name: product_id
        data_type: bigint
        description: |
          商品ID
          参照元のstg_ec__orders の product_idが、
          参照先のstg_ec__product_catalog の product_id として存在するかを確認。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ec__products')
                field: product_id
      - name: quantity
        data_type: integer
      - name: unit_price
        data_type: numeric(10,2)
      - name: ordered_at
        data_type: timestamp with time zone
      - name: created_at
        data_type: timestamp with time zone
      - name: updated_at
        data_type: timestamp with time zone

unit_tests:
  - name: test_stg_ec_orders_jst_date
    model: stg_ec__orders
    given:
      - input: source('ec', 'orders')
        rows:
          - {id: 1, ordered_at: "2026-01-01 14:59:00+00"}
          - {id: 2, ordered_at: "2026-01-01 15:00:00+00"}
    expect:
      rows:
        - {order_id: 1, order_date: "2026-01-01"}
        - {order_id: 2, order_date: "2026-01-02"}
